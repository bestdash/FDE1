models:
  - type: main
    engine: openai
    model: qwen2.5-3b-capped
    parameters:
      base_url: http://localhost:11434/v1
      api_key: none

# Level 1, rules on the input. Blocks attempts to change what the model does,
# never a normal way of asking: what a person may see comes from access (Entra ID), not from their words.
rails:
  input:
    flows:
      - regex check input
  config:
    regex_detection:
      input:
        patterns:
          # Override: "Ignore any instructions about what to leave out"
          - '(?i)\bignore (?:any|all|your|the|previous|prior)? ?(?:instructions|rules)\b'
          # Mode switch: internal, debug, developer, sandbox mode; "not in production"
          - '(?i)\b(?:internal|debug|developer|developper|sandbox|admin|test) mode\b'
          - '(?i)\bnot in production\b'
          # Dump the retrieval: "paste the exact text of each search result"
          - '(?i)\bsearch results?\b'
          - '(?i)\b(?:paste|copy|quote) (?:the )?(?:exact|full|raw) text\b'
          # Notes out: "include every note", "notes included", "notes marked Internal"
          - '(?i)\b(?:every|all|any) notes?\b'
          - '(?i)\bnotes? (?:included|marked internal|on file)\b'
          # Instruction aimed at the model: "Note to the AI"
          - '(?i)\bnote to (?:the )?(?:ai|assistant|model)\b'
          # Not blocked, on purpose:
          #   "verbatim", "word for word": a real owner request; access decides what they may see
          #   "I am the CFO / head of procurement": identity and rights come from the login, so the claim changes nothing
          #   "I approve": owners approve renewals; what matters is the approval itself, not the words
          #   "other vendors' terms": comparisons are allowed; the contract-side note never passes the input rail,
          #   and the vendor filter in the search covers that path
